.grid>*{animation:up .5s cubic-bezier(.2,.7,.2,1) both}
.grid>:nth-child(2){animation-delay:.06s}.grid>:nth-child(3){animation-delay:.12s}.grid>:nth-child(4){animation-delay:.18s}.grid>:nth-child(5){animation-delay:.24s}
.card{background:linear-gradient(180deg,var(--pn2),var(--pn));border:1px solid var(--ln);border-radius:var(--r);overflow:hidden;cursor:pointer;text-align:left;color:inherit;font:inherit;padding:0;display:block;width:100%;box-shadow:var(--sh)}
button.card{transition:transform .2s,border-color .2s,box-shadow .2s}

.card .cb{padding:16px}
.card h3{font-size:25px}
.card p{color:var(--mu);font-size:14px}
img.card.cv{border-radius:var(--r);max-height:340px}
.ph{background:repeating-linear-gradient(45deg,#0a110b,#0a110b 10px,#0f1a11 10px,#0f1a11 20px)}
.badge{display:inline-block;padding:3px 10px;border:1px solid var(--ln);border-radius:999px;font-size:13px;color:var(--mu);margin-top:10px;background:rgba(0,0,0,.25)}
.badge.on{border-color:var(--gr);color:var(--gr);background:rgba(67,209,106,.08)}
.badge.off{border-color:var(--rd);color:var(--rd)}
button{font:600 15px Barlow,sans-serif;background:linear-gradient(180deg,var(--gr),var(--gr2));color:#03110a;border:0;border-radius:8px;padding:10px 18px;cursor:pointer;box-shadow:0 4px 14px rgba(67,209,106,.25);transition:transform .15s,filter .15s,box-shadow .15s,background .15s}
button:hover{filter:brightness(1.1);transform:translateY(-1px);box-shadow:0 8px 20px rgba(67,209,106,.3)}
button:active{transform:scale(.97)}
button.g{background:rgba(255,255,255,.03);color:var(--tx);border:1px solid var(--ln);box-shadow:none}
button.g:hover{border-color:var(--gr);background:rgba(67,209,106,.07);box-shadow:none}
button.g.act{border-color:var(--gr);color:var(--gr);background:rgba(67,209,106,.1)}
button.d{background:linear-gradient(180deg,#f0706a,var(--rd));color:#fff;box-shadow:0 4px 14px rgba(239,91,84,.25)}
button:disabled{opacity:.5;cursor:not-allowed;transform:none;filter:none}

input,select,textarea{width:100%;background:#08100a;color:var(--tx);border:1px solid var(--ln);border-radius:8px;padding:10px 12px;font:inherit;transition:border-color .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{border-color:var(--gr);box-shadow:0 0 0 3px rgba(67,209,106,.15)}
textarea{resize:vertical}
.q{background:linear-gradient(180deg,var(--pn2),var(--pn));border:1px solid var(--ln);border-radius:var(--r);padding:18px;margin-bottom:14px}
.q:focus-within{border-color:rgba(67,209,106,.6)}
.ql{display:block;font-weight:600;margin-bottom:10px}
.opt{display:flex;gap:10px;align-items:center;padding:5px 0;cursor:pointer}
.opt input{width:auto;accent-color:var(--gr)}
.sc{display:flex;gap:8px;flex-wrap:wrap}
.sc .opt{border:1px solid var(--ln);border-radius:8px;padding:8px 16px;transition:border-color .15s,background .15s}
.sc .opt:hover,.sc .opt:has(input:checked){border-color:var(--gr);background:rgba(67,209,106,.1)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row>*{flex:0 0 auto}
.row .fl{flex:1 1 200px}
.fr{background:linear-gradient(180deg,var(--pn2),var(--pn));border:1px solid var(--ln);border-radius:var(--r);padding:16px;margin-bottom:12px;display:grid;gap:10px}
.tabs{display:flex;gap:8px;margin-bottom:22px;flex-wrap:wrap}
.tw{overflow-x:auto;border:1px solid var(--ln);border-radius:var(--r)}
table{width:100%;border-collapse:collapse}
th,td{padding:10px 12px;border-bottom:1px solid var(--ln);text-align:left;vertical-align:top;font-size:14px}
th{color:var(--mu);font-weight:600;background:rgba(255,255,255,.02)}
tbody tr:hover{background:rgba(67,209,106,.05)}
.st{font-weight:600}
.st.em_analise{color:var(--am)}.st.aprovado{color:var(--gr)}.st.reprovado{color:var(--rd)}
details{background:linear-gradient(180deg,var(--pn2),var(--pn));border:1px solid var(--ln);border-radius:var(--r);padding:12px 14px;margin-bottom:10px;transition:border-color .2s}

summary{cursor:pointer;font-weight:600;overflow-wrap:anywhere}
.ans{margin-top:10px;display:grid;gap:8px;animation:up .3s both}
.ans b{color:var(--mu);font-weight:500;display:block;font-size:13px}
.hero{padding:64px 0;text-align:left}
.hero h2{font-size:clamp(40px,9vw,76px);line-height:1;text-shadow:0 0 30px rgba(67,209,106,.3)}
.hero p{color:var(--mu);max-width:56ch;margin:14px 0 24px}
.msg{padding:14px 16px;border:1px solid var(--am);border-radius:var(--r);background:rgba(232,176,74,.07);color:var(--am);margin-bottom:16px}
.empty{padding:40px 20px;text-align:center;border:1px dashed var(--ln);border-radius:var(--r);color:var(--mu)}
.empty h3{font-size:26px;color:var(--tx);margin-bottom:6px}
label.f{display:block;margin:10px 0 4px;color:var(--mu);font-size:14px}
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--pn2);border:1px solid var(--gr);border-radius:10px;padding:12px 20px;z-index:9;display:none;max-width:90vw;box-shadow:var(--sh);animation:up .25s both}
#toast.bad{border-color:var(--rd)}
.who{color:var(--mu);font-size:14px}
.sk{border-radius:var(--r);height:230px;background:linear-gradient(100deg,var(--pn) 30%,var(--pn2) 50%,var(--pn) 70%);background-size:200% 100%;animation:sh 1.3s linear infinite;border:1px solid var(--ln)}
#splash{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;background:var(--bg);animation:spOut .6s ease var(--sd,4.2s) forwards}
.sp{text-align:center;padding:20px}
.sp-l{width:64px;height:2px;margin:0 auto 18px;background:var(--gr);box-shadow:0 0 16px var(--gr);animation:ln 1s ease both}
.sp-t{font:700 clamp(34px,8vw,64px)/1 'Barlow Condensed',Impact,sans-serif;letter-spacing:.04em;animation:up .8s .25s both}
.sp-c{margin-top:28px;font-size:14px;letter-spacing:.05em;color:var(--gr);animation:up .8s 1.1s both}
footer{max-width:1040px;margin:0 auto;padding:0 16px 32px;color:var(--mu);font-size:13px;text-align:center}
.sp-s{color:var(--mu);margin-top:10px;animation:up .8s .6s both}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes sh{to{background-position:-200% 0}}
@keyframes ln{from{width:0}to{width:64px}}
@keyframes spOut{to{opacity:0;visibility:hidden}}

body::before{content:"";position:fixed;inset:-25%;z-index:-1;pointer-events:none;background:conic-gradient(from 0deg at 70% 20%,rgba(67,209,106,.09),transparent 25%,rgba(31,143,67,.07) 50%,transparent 75%,rgba(67,209,106,.09));filter:blur(70px);animation:aur 34s linear infinite}
@keyframes aur{to{transform:rotate(360deg)}}
button.card{position:relative}
button.card::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 40%,rgba(255,255,255,.08) 50%,transparent 60%);transform:translateX(-100%);transition:transform .8s;pointer-events:none}

html{scrollbar-color:var(--ln) var(--bg)}

.sp{position:relative;z-index:2}

.sp-t{position:relative;text-shadow:0 0 34px rgba(67,209,106,.55),0 0 2px rgba(255,255,255,.7);animation:mat 1.7s .3s both,hn 6s 2.4s infinite}
.sp-t::before,.sp-t::after{content:attr(data-t);position:absolute;left:0;right:0;top:0;opacity:.28;filter:blur(3px);pointer-events:none;animation:ec 3.6s ease-in-out infinite alternate}
.sp-t::before{color:var(--gr);transform:translate(-7px,-4px)}

@keyframes mat{from{opacity:0;filter:blur(20px);letter-spacing:.42em;transform:translateY(22px)}to{opacity:1;filter:none;letter-spacing:.04em;transform:none}}
@keyframes hn{0%,90%,100%{opacity:1}93%{opacity:.55}95%{opacity:1}97%{opacity:.7}}
.sp-c{position:relative;overflow:hidden;display:inline-block;margin-top:32px;padding:11px 26px;border:1px solid rgba(67,209,106,.45);border-radius:999px;background:rgba(67,209,106,.07);color:#e9ffee;font-size:15px;letter-spacing:.09em;box-shadow:0 0 30px rgba(67,209,106,.18),inset 0 0 18px rgba(67,209,106,.08);animation:up .9s 1.5s both}

.sp-k{position:absolute;right:18px;bottom:18px;z-index:3;background:transparent;color:var(--mu);border:1px solid var(--ln);box-shadow:none;padding:6px 14px;font-size:13px}
.noghost .gh,.nofog .fog,.nosk .sp-k,.nocr .sp-c{display:none}
@media (max-width:600px){header{padding:10px 14px;flex-wrap:wrap}header h1{font-size:21px}.hero{padding:40px 0}.grid{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}#splash{display:none}.ck circle,.ck path{stroke-dashoffset:0!important}}
</style>

function canAccess(f){
  if(S.admin)return true;
  if(!f.role_ids.length)return true;
  if(!S.rolesOk)return false;
  return f.role_ids.some(r=>S.roles.includes(r));
}
function state(f){
  const n=Date.now();
  if(f.opens_at&&n<new Date(f.opens_at))return'soon';
  if(f.closes_at&&n>new Date(f.closes_at))return'closed';
  return'open';
}

function fieldHtml(f){
  const n=`name="${esc(f.id)}"`,o=f.options||[];let i='';
  if(f.type==='long')i=`<textarea ${n} rows="4" maxlength="4000"></textarea>`;
  else if(f.type==='radio')i=o.map(x=>`<label class="opt"><input type="radio" ${n} value="${esc(x)}">${esc(x)}</label>`).join('');
  else if(f.type==='checkbox')i=o.map(x=>`<label class="opt"><input type="checkbox" ${n} value="${esc(x)}">${esc(x)}</label>`).join('');
  else if(f.type==='select')i=`<select ${n}><option value="">Selecione</option>${o.map(x=>`<option>${esc(x)}</option>`).join('')}</select>`;
  else if(f.type==='scale')i=`<div class="sc">${[1,2,3,4,5].map(x=>`<label class="opt"><input type="radio" ${n} value="${x}">${x}</label>`).join('')}</div>`;
  else if(f.type==='date')i=`<input type="date" ${n}>`;
  else if(f.type==='number')i=`<input type="number" ${n}>`;
  else if(f.type==='email')i=`<input type="email" ${n} maxlength="200">`;
  else if(f.type==='roblox')i=`<input type="text" ${n} maxlength="60" placeholder="${esc(pv('ph_rbx'))}">`;
  else if(f.type==='discord')i=`<input type="text" ${n} maxlength="60" placeholder="${esc(pv('ph_dc'))}">`;
  else i=`<input type="text" ${n} maxlength="500">`;
  return`<div class="q"><span class="ql">${esc(f.label)}${f.required?' '+esc(pv('star')):''}</span>${i}</div>`;
}
function renderForm(w){

function collect(f){
  const root=$('#fm'),a={};
  for(const q of f.fields){
    let v;
    if(q.type==='checkbox')v=[...root.querySelectorAll(`[name="${q.id}"]:checked`)].map(x=>x.value);
    else if(q.type==='radio'||q.type==='scale'){const c=root.querySelector(`[name="${q.id}"]:checked`);v=c?c.value:''}
    else v=(root.querySelector(`[name="${q.id}"]`)?.value||'').trim().slice(0,4000);
    if(q.required&&(!v||!v.length))return{err:`Preencha: ${q.label}`};
    if(q.type==='email'&&v&&!/^\S+@\S+\.\S+$/.test(v))return{err:`E-mail inválido em: ${q.label}`};
    a[q.id]={q:q.label,v};
  }
  return{a};
}

  const a=document.createElement('a');a.href=u;a.download='backup-editais.json';a.click();
  setTimeout(()=>URL.revokeObjectURL(u),2000);log('backup','Backup exportado');
}
async function impBk(file){
  if(!file||S.busy)return;
  let j;try{j=JSON.parse(await file.text())}catch(e){return toast('Arquivo inválido.',1)}
  if(!j||!Array.isArray(j.forms)||!confirm('Restaurar este backup? Configurações e editais atuais serão substituídos.'))return;
  S.busy=true;
  const kf=['title','description','image','published','opens_at','closes_at','role_ids','fields','max_responses','success_msg'];
  const rows=j.forms.filter(f=>f&&ORGS.includes(f.org)).map(f=>{const o={org:f.org};kf.forEach(k=>{if(k in f)o[k]=f[k]});if(o.image&&!safeUrl(o.image))o.image='';return o});
  const e1=await sb.from('forms').upsert(rows,{onConflict:'org'});
  let e2=null;
  if(j.settings){
    const ks=['title','server_image','credits','intro_on','intro_title','intro_sub','accent','login_text','footer','notice','prefs','maintenance','maintenance_msg'],p={id:1};
    ks.forEach(k=>{if(k in j.settings)p[k]=j.settings[k]});
    if(p.server_image&&!safeUrl(p.server_image))p.server_image='';
    e2=(await sb.from('settings').upsert(p)).error;
  }
  S.busy=false;
  if(e1.error||e2)return toast('Falha ao restaurar o backup.',1);
  log('backup','Backup restaurado');await loadData();applySettings();render();toast('Backup restaurado.');
}
document.addEventListener('click',async ev=>{
  const b=ev.target.closest('[data-a]');if(!b)return;
  const a=b.dataset.a,v=b.dataset.v;
  if(a==='login'){await sb.auth.signInWithOAuth({provider:'discord',options:{scopes:'identify',redirectTo:location.origin+location.pathname}})}
  else if(a==='logout'){sessionStorage.removeItem('pt');await sb.auth.signOut();location.reload()}
  else if(a==='nav'){syncEd();S.view=v;render()}
  else if(a==='open'){S.org=v;S.view='form';render();scrollTo(0,0)}
  else if(a==='submit')submit();
  else if(a==='tab'){syncEd();S.tab=v;render()}
  else if(a==='status')setStatus(v,b.dataset.s);
  else if(a==='csv')csv();
  else if(a==='addf'){syncEd();S.ed.fields.push({id:uid(),type:'short',label:'',required:false,options:[]});tabBuild()}
  else if(a==='delf'){syncEd();S.ed.fields.splice(+v,1);tabBuild()}
  else if(a==='upf'){syncEd();const i=+v;if(i>0){[S.ed.fields[i-1],S.ed.fields[i]]=[S.ed.fields[i],S.ed.fields[i-1]];tabBuild()}}
  else if(a==='dnf'){syncEd();const i=+v;if(i<S.ed.fields.length-1){[S.ed.fields[i+1],S.ed.fields[i]]=[S.ed.fields[i],S.ed.fields[i+1]];tabBuild()}}
  else if(a==='savef')saveForm();
  else if(a==='saves')saveSrv();
  else if(a==='saveo')saveOrg(v);
  else if(a==='addadm')addAdm();
  else if(a==='skip'){const e=$('#splash');if(e)e.remove()}
  else if(a==='savepf')savePf(false);
  else if(a==='rstpf')savePf(true);
  else if(a==='swatch'){$('#s_a').value=v}
  else if(a==='preview'){S.org=S.edOrg;S.view='form';render();scrollTo(0,0)}
  else if(a==='selall'){document.querySelectorAll('.sel').forEach(x=>x.checked=true)}
  else if(a==='bulk')bulk(b.dataset.s);
  else if(a==='cpids'){navigator.clipboard.writeText(CUR.map(r=>r.discord_id).join('\n')).then(()=>toast(CUR.length+' IDs copiados.')).catch(()=>toast('Não foi possível copiar.',1))}
  else if(a==='savenote')saveNote(v);
  else if(a==='cpform'){syncEd();const f=S.forms[$('#cp').value];if(f&&confirm('Substituir as perguntas atuais pelas de '+f.org+'?')){S.ed.fields=clone(f.fields).map(x=>({...x,id:uid()}));tabBuild()}}
  else if(a==='expbk')expBk();
  else if(a==='deladm')delAdm(v);
  else if(a==='delresp')delResp(v);
});
document.addEventListener('change',ev=>{
  const t=ev.target;
  if(t.id==='ro'){S.respOrg=t.value;tabResp()}
  else if(t.id==='rf'||t.id==='rs')listResp();
  else if(t.id==='eo'){S.edOrg=t.value;S.ed=null;tabBuild()}
  else if(t.id==='bk'){impBk(t.files[0]);t.value=''}
  else if(t.classList.contains('t')){syncEd();tabBuild()}
});
document.addEventListener('input',ev=>{if(ev.target.id==='rq')listResp();else if(ev.target.id==='lq')listLogs();else if(ev.target.closest&&ev.target.closest('#fm')){prog();clearTimeout(dt);dt=setTimeout(saveDraft,400)}});
(()=>{const e=$('#splash');if(!e)return;if(sessionStorage.getItem('sp')){e.remove();return}sessionStorage.setItem('sp','1');e.addEventListener('animationend',v=>{if(v.animationName==='spOut')e.remove()});setTimeout(()=>e.remove(),9500)})();
let raf=0;
document.addEventListener('pointermove',e=>{const c=e.target.closest&&e.target.closest('button.card');if(!c||raf)return;raf=requestAnimationFrame(()=>{raf=0;const r=c.getBoundingClientRect();c.style.setProperty('--mx',(e.clientX-r.left)+'px');c.style.setProperty('--my',(e.clientY-r.top)+'px')})});
init();
</script>
</body>
